name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check src tests examples webui
      - run: ruff format --check src tests examples webui

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python examples/main.py

  webui:
    name: web interface (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r webui/requirements.txt
      - run: python webui/manage.py check
      - run: python webui/manage.py makemigrations --check --dry-run
      - run: python webui/manage.py test detection

  notebook:
    name: example notebook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[examples]"
      - run: >-
          python -m jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.kernel_name=python3
          --output-dir "$RUNNER_TEMP" examples/examples.ipynb

  test-oldest:
    # The minimum versions declared in pyproject.toml; keep both in sync.
    name: test (oldest dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install -e ".[dev]"
          "numpy==2.0.2" "pandas==2.2.3" "scikit-learn==1.5.2"
          "pyod==2.0.2" "category-encoders==2.6.4" "joblib==1.5.0"
      - run: python -m pytest
