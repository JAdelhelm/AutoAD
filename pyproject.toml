[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autoad-framework"
dynamic = ["version"]
description = "Automatic preprocessing and anomaly detection for tabular data, built on scikit-learn and PyOD."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "JAdelhelm" }]
keywords = ["anomaly detection", "outlier detection", "preprocessing", "scikit-learn", "pyod"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyod>=2.0",
    "category-encoders>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
examples = ["notebook>=7"]

[project.urls]
Homepage = "https://github.com/JAdelhelm/AutoAD"
Issues = "https://github.com/JAdelhelm/AutoAD/issues"
Changelog = "https://github.com/JAdelhelm/AutoAD/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "autoad.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Deprecations triggered by AutoAD's own code must fail the tests (pandas 3 lessons).
filterwarnings = [
    "error::FutureWarning:autoad",
    "error::DeprecationWarning:autoad",
    # Raised inside category_encoders itself under pandas 3, not by AutoAD.
    "ignore:'future.no_silent_downcasting' is deprecated:DeprecationWarning:category_encoders",
]

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
